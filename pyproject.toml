[project]
name = "secop-agent"
version = "0.1.0"
description = "LLM agent that analyses Colombian public procurement (SECOP II) processes, traced with LangSmith."
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0",
    "langchain-anthropic>=1.7",
    "langgraph>=1.0",
    "langsmith>=0.4",
    "python-dotenv",
    "requests",
    "pypdf>=5",
    "gradio>=5,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "nbformat>=5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["secop_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
